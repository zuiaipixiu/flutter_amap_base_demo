group 'me.yohom.amapbase'
version '1.0-SNAPSHOT'


buildscript {
    ext.kotlin_version = '1.8.0'
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    compileSdkVersion 33
    namespace = "me.yohom.amapbase"

    sourceSets {
        main.jniLibs.srcDirs=['libs']
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.0-alpha01'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.8.22'

//    implementation 'com.amap.api:navi-3dmap:9.8.2_3dmap9.8.2'
//    implementation 'com.amap.api:search:9.7.0'
//    implementation 'com.amap.api:location:6.4.0'
//    implementation 'com.amap.api:navi-3dmap:9.8.2'
//    implementation 'com.amap.api:location:latest.integration'
//    implementation 'com.amap.api:search:latest.integration'
//    implementation fileTree(include: ['*.jar'], dir: 'libs')
//    implementation files('libs/AMap3DMap_9.8.2_AMapNavi_9.8.2_AMapSearch_9.7.0_AMapLocation_6.4.0_20230808.jar')

    // implementation 'com.amap.api:navi-3dmap:latest.integration'
    // implementation 'com.amap.api:search:latest.integration'
    // implementation 'com.amap.api:location:latest.integration' 

    // 需要getter和setter序列化时, 使用fastjson
    implementation 'com.alibaba:fastjson:1.2.54'
    // 其他情况使用gson, fastjson会有默认构造器问题
    implementation 'com.google.code.gson:gson:2.8.5'
}
