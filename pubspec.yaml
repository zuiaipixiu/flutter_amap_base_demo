name: flutter_amap_base
description: Fully Functional AMap Flutter Plugin. Based on AndroidView/UiKitView.
version: 1.0.7
homepage: https://github.com/YunFeng-Huang/flutter_amap_base.git

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: "^3.10.3"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_lints: ^5.0.0

#platforms:
#  - android
#  - ios
# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: me.yohom.amapbase
        pluginClass: AMapBasePlugin
      ios:
        pluginClass: AMapBasePlugin


  # To add assets to your plugin package, add an assets section, like this:
  assets:
    - images/
